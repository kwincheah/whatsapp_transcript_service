<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860" role="img" aria-label="Example WhatsApp chat: a voice note is transcribed and summarised, and a PDF is summarised">
  <defs>
    <pattern id="wall" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M8 10h6M26 30h6M30 8v6M10 26v6" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Window -->
    <rect width="880" height="860" rx="22" fill="#0B141A"/>
    <rect y="72" width="880" height="788" fill="url(#wall)"/>

    <!-- Header -->
    <path d="M22 0h836a22 22 0 0 1 22 22v50H0V22A22 22 0 0 1 22 0z" fill="#202C33"/>
    <circle cx="48" cy="36" r="20" fill="#25D366"/>
    <g fill="#063B34">
      <rect x="37" y="31" width="4" height="10" rx="2"/>
      <rect x="44" y="26" width="4" height="20" rx="2"/>
      <rect x="51" y="29" width="4" height="14" rx="2"/>
      <rect x="58" y="32" width="4" height="8" rx="2"/>
    </g>
    <text x="80" y="32" fill="#E9EDEF" font-size="18" font-weight="600">Transcriber Bot</text>
    <text x="80" y="53" fill="#8696A0" font-size="14">online</text>

    <!-- 1. Outgoing voice note -->
    <g filter="url(#shadow)">
      <rect x="500" y="100" width="350" height="66" rx="10" fill="#005C4B"/>
    </g>
    <circle cx="536" cy="133" r="17" fill="#E9EDEF"/>
    <path d="M531 124l14 9-14 9z" fill="#005C4B"/>
    <g fill="#8FD4C1">
      <rect x="566" y="127" width="3" height="12" rx="1.5"/><rect x="573" y="121" width="3" height="24" rx="1.5"/>
      <rect x="580" y="124" width="3" height="18" rx="1.5"/><rect x="587" y="117" width="3" height="32" rx="1.5"/>
      <rect x="594" y="123" width="3" height="20" rx="1.5"/><rect x="601" y="128" width="3" height="10" rx="1.5"/>
      <rect x="608" y="120" width="3" height="26" rx="1.5"/><rect x="615" y="125" width="3" height="16" rx="1.5"/>
      <rect x="622" y="118" width="3" height="30" rx="1.5"/><rect x="629" y="126" width="3" height="14" rx="1.5"/>
      <rect x="636" y="122" width="3" height="22" rx="1.5"/><rect x="643" y="128" width="3" height="10" rx="1.5"/>
      <rect x="650" y="124" width="3" height="18" rx="1.5"/><rect x="657" y="119" width="3" height="28" rx="1.5"/>
      <rect x="664" y="126" width="3" height="14" rx="1.5"/><rect x="671" y="123" width="3" height="20" rx="1.5"/>
      <rect x="678" y="128" width="3" height="10" rx="1.5"/><rect x="685" y="125" width="3" height="16" rx="1.5"/>
      <rect x="692" y="121" width="3" height="24" rx="1.5"/><rect x="699" y="127" width="3" height="12" rx="1.5"/>
      <rect x="706" y="124" width="3" height="18" rx="1.5"/><rect x="713" y="129" width="3" height="8" rx="1.5"/>
    </g>
    <text x="730" y="138" fill="#B7E4D8" font-size="14">0:14</text>
    <text x="838" y="158" fill="#8FD4C1" font-size="12" text-anchor="end">09:41 ✓✓</text>

    <!-- 2. Bot: transcript -->
    <g filter="url(#shadow)">
      <rect x="30" y="186" width="560" height="132" rx="10" fill="#202C33"/>
    </g>
    <text x="48" y="214" fill="#25D366" font-size="15" font-weight="700">Transcript</text>
    <text x="48" y="240" fill="#E9EDEF" font-size="15">Eh bro, meeting tomorrow shift to 3pm ah, bring the Q3 deck</text>
    <text x="48" y="262" fill="#E9EDEF" font-size="15">and the budget numbers. Also remind Aisyah to book the room.</text>
    <text x="48" y="296" fill="#8696A0" font-size="13" font-style="italic">⏱ STT gpt-4o-mini-transcribe 1.12s · Audio 14s</text>
    <text x="578" y="308" fill="#8696A0" font-size="12" text-anchor="end">09:41</text>

    <!-- 3. Bot: summary -->
    <g filter="url(#shadow)">
      <rect x="30" y="330" width="560" height="104" rx="10" fill="#202C33"/>
    </g>
    <text x="48" y="358" fill="#25D366" font-size="15" font-weight="700">Summary</text>
    <text x="48" y="384" fill="#E9EDEF" font-size="15">Meeting moved to 3pm tomorrow; bring Q3 deck and budget.</text>
    <text x="48" y="414" fill="#8696A0" font-size="13" font-style="italic">⏱ Summary deepseek-v4-flash 0.58s · Total 2.04s · $0.0008</text>
    <text x="578" y="424" fill="#8696A0" font-size="12" text-anchor="end">09:41</text>

    <!-- 4. Outgoing PDF -->
    <g filter="url(#shadow)">
      <rect x="500" y="466" width="350" height="96" rx="10" fill="#005C4B"/>
    </g>
    <rect x="514" y="478" width="322" height="56" rx="8" fill="#025144"/>
    <rect x="526" y="488" width="30" height="36" rx="4" fill="#F15C5C"/>
    <text x="541" y="511" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">PDF</text>
    <text x="568" y="502" fill="#E9EDEF" font-size="15" font-weight="600">Q3_report.pdf</text>
    <text x="568" y="522" fill="#8FD4C1" font-size="13">12 pages · 1.8 MB</text>
    <text x="516" y="554" fill="#E9EDEF" font-size="14">Did revenue grow?</text>
    <text x="838" y="554" fill="#8FD4C1" font-size="12" text-anchor="end">09:43 ✓✓</text>

    <!-- 5. Bot: document analysis -->
    <g filter="url(#shadow)">
      <rect x="30" y="582" width="620" height="252" rx="10" fill="#202C33"/>
    </g>
    <text x="48" y="610" fill="#E9EDEF" font-size="16" font-weight="700">Q3 Financial Results Summary</text>
    <text x="48" y="630" fill="#8696A0" font-size="13">Q3_report.pdf · PDF · 12 pages</text>
    <text x="48" y="660" fill="#25D366" font-size="15" font-weight="700">Did revenue grow?</text>
    <text x="48" y="682" fill="#E9EDEF" font-size="15">Yes. Revenue grew 10% year on year to RM 4.2M.</text>
    <text x="48" y="712" fill="#25D366" font-size="15" font-weight="700">Key points</text>
    <text x="48" y="734" fill="#E9EDEF" font-size="15">•  Revenue RM 4.2M (+10% YoY)</text>
    <text x="48" y="756" fill="#E9EDEF" font-size="15">•  Operating margin 18%, unchanged</text>
    <text x="48" y="778" fill="#E9EDEF" font-size="15">•  Board review due 15 Oct</text>
    <text x="48" y="812" fill="#8696A0" font-size="13" font-style="italic">⏱ Analysis deepseek-v4-flash 3.10s · Total 3.62s · 9.4k tokens in · $0.0034</text>
    <text x="638" y="824" fill="#8696A0" font-size="12" text-anchor="end">09:43</text>
  </g>
</svg>
